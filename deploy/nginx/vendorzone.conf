# /etc/nginx/conf.d/multivendor.conf
# Install: sudo cp deploy/nginx/*.conf /etc/nginx/ (see deploy/README.md), nginx -t, reload.
#
# Two layers of rate limiting:
#   here (Nginx)   per IP, leaky bucket, cheap: absorbs floods before they reach Node.
#                  `burst` without `nodelay` queues the excess and releases it at the set
#                  rate, so a burst is slowed down (throttled) rather than refused.
#   in the app     sliding window per IP / email / account in Redis: business rules such as
#                  "5 wrong passwords in 15 minutes" (backend/middleware/rateLimit.js).

limit_req_zone $binary_remote_addr zone=vz_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=vz_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=vz_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream vz_api {
    server 127.0.0.1:8000;
    keepalive 16;               # reuse connections to Node instead of a TCP handshake per request
}

server {
    listen 443 ssl http2;       # nginx >= 1.25.1 prefers "listen 443 ssl;" plus "http2 on;"
    server_name vendorzone.tech www.vendorzone.tech;

    ssl_certificate /etc/letsencrypt/live/vendorzone.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vendorzone.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/app;
    index index.html;
    server_tokens off;
    client_max_body_size 32m;   # 6 images x 5 MB plus form fields
    limit_conn vz_conn 40;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=vz_api burst=40 delay=20;
        proxy_pass http://vz_api;
        include /etc/nginx/vendorzone-proxy.conf;
    }

    # sign-in, sign-up and password-reset endpoints: 10 a minute per IP, queued beyond that
    location ~ ^/api/v1/(user|shop)/(login-user|login-shop|create-user|create-shop|forgot-password|reset-password|activation) {
        limit_req zone=vz_auth burst=10;
        proxy_pass http://vz_api;
        include /etc/nginx/vendorzone-proxy.conf;
    }

    # uploaded images and their variants; names are unique, Express sets a 1-year immutable cache
    location /uploads/ {
        proxy_pass http://vz_api;
        include /etc/nginx/vendorzone-proxy.conf;
    }

    # Vite output: content-hashed file names never change
    location /assets/ {
        include /etc/nginx/vendorzone-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /banners/ {
        include /etc/nginx/vendorzone-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # the SPA shell must always be revalidated so a deploy is picked up immediately
    location / {
        include /etc/nginx/vendorzone-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

server {
    listen 80 default_server;
    server_name vendorzone.tech www.vendorzone.tech;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/app; }
    location / { return 301 https://$host$request_uri; }
}
