# /etc/nginx/vendorzone-headers.conf
# Security headers for the pages and static files Nginx serves itself. (The API sets its
# own through helmet.) Included per location because an add_header inside a location
# stops the server-level ones from being inherited.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Stripe Elements needs js.stripe.com (script + iframe) and api.stripe.com; fonts come
# from Google Fonts. 'unsafe-inline' styles are needed by React style props and Stripe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.stripe.com; connect-src 'self' https://api.stripe.com https://m.stripe.network https://r.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
