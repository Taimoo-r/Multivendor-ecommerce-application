# /etc/nginx/vendorzone-proxy.conf: shared settings for requests passed to the Node API
proxy_http_version 1.1;
proxy_set_header Connection "";             # keep the upstream connection alive
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, never append a client-supplied value
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
